name: Deploy to Cloudflare Pages

# Rebuilds the Astro site and deploys it to Cloudflare Pages on every push to
# main — including the commits the CMS makes when Alex edits content.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies & build
        working-directory: cms-site
        run: |
          npm install --no-fund --no-audit
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7b91bb41c7f61f8223551bd16736954d
          workingDirectory: cms-site
          command: pages deploy dist --project-name=derousselmedia --branch=main --commit-dirty=true
